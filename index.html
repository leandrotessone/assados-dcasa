<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assados D’Casa – Faça seu pedido</title>
<style>
:root{--bg:#fbf6ef;--card:#fff;--tx:#2b2118;--mut:#7a6a5b;--ac:#c8201c;--acx:#fff;--bd:#e8dccd;--ok:#15803d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1613;--card:#2a211c;--tx:#f3e9de;--mut:#b5a493;--ac:#f97316;--acx:#1c1613;--bd:#43362c;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1613;--card:#2a211c;--tx:#f3e9de;--mut:#b5a493;--ac:#f97316;--acx:#1c1613;--bd:#43362c;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item small{display:block;color:var(--mut)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px}
.step b{min-width:18px;text-align:center}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:6px 0 12px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-size:16px;font-weight:700}
.btn.sec{background:transparent;color:var(--mut);border:1px solid var(--bd);font-weight:500;margin-top:8px;padding:10px}
.row{display:flex;justify-content:space-between;gap:8px}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--mut)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill button{all:unset}
.hint{font-size:12px;color:var(--mut);margin-top:10px}
.empty{color:var(--mut);text-align:center;padding:18px}
.tl{overflow-x:auto}
</style>
</head>
<body>
<main>
<div style="background:#111;border-bottom:4px solid #fbbf24;border-radius:14px;padding:14px 16px;margin-bottom:12px"><h1 style="margin:0;color:#fbbf24">🔥 Assados D’Casa</h1><div style="color:#f3e9de;font-size:14px">Cardápio de domingo · Nossa família atendendo a sua.</div><div style="color:#fbbf24;font-size:13px;margin-top:6px">📍 Rua Bernardino de Campos, 35 · (16) 99789-6199</div></div>
<section id="v1">
  <div class="card" id="menu"></div>
  <div class="card">
    <label for="nome">Seu nome</label><input id="nome" autocomplete="name">
    <label for="tel">Telefone</label><input id="tel" type="tel" autocomplete="tel">
    <label for="tipo">Retirada ou entrega</label>
    <select id="tipo"><option>Retirada</option><option>Entrega</option></select>
    <label for="end" id="endl" hidden>Endereço</label><input id="end" hidden>
    <label for="hora">Horário</label>
    <select id="hora"><option>11:00</option><option>11:30</option><option>12:00</option><option>12:30</option><option>13:00</option></select>
    <label for="pag">Pagamento</label>
    <select id="pag"><option>Pix</option><option>Dinheiro</option><option>Cartão na entrega</option></select>
    <label for="obs">Observações</label><textarea id="obs" rows="2"></textarea>
  </div>
  <div class="total"><span>Total</span><span id="tot">R$ 0,00</span></div>
  <button class="btn" onclick="enviar()">Enviar pelo WhatsApp</button>
  <div class="hint" id="msg1"></div>
</section>

</main>

<script>
var FONE = "5516997896199"; // WhatsApp do Ronaldo (DDD 16 presumido)
var CARD = [
  {id:"fa",n:"🍗 Frango Assado",p:50},
  {id:"br",n:"🍗 Brachola de Frango",p:60},
  {id:"fr",n:"🍗 Frango a Role",p:80},
  {id:"ro",n:"🥩 Rocambole de Carne Moída",p:60},
  {id:"cu",n:"🥩 Cupim Angus",p:110},
  {id:"cr",n:"🥩 Costela Recheada (kg)",p:80},
  {id:"co",n:"🥩 Costela",p:70},
  {id:"cl",n:"🥩 Costelão",p:80},
  {id:"ji",n:"🐷 Joelho de Porco Injetado",p:70},
  {id:"jt",n:"🐷 Joelho de Porco Tradicional",p:70},
  {id:"pa",n:"🥓 Panceta",p:70},
  {id:"sm",n:"🥗 Salada de Maionese (500g)",p:25}
];
var qtd = {};
function brl(v){return "R$ "+v.toFixed(2).replace(".",",")}
function $(i){return document.getElementById(i)}
function menu(){
  $("menu").innerHTML=CARD.map(function(c){return '<div class="item"><div>'+c.n+'<small>'+brl(c.p)+'</small></div><div class="step"><button onclick="mv(\''+c.id+'\',-1)">−</button><b id="q_'+c.id+'">'+(qtd[c.id]||0)+'</b><button onclick="mv(\''+c.id+'\',1)">+</button></div></div>'}).join("");
}
function mv(id,d){qtd[id]=Math.max(0,(qtd[id]||0)+d);$("q_"+id).textContent=qtd[id];$("tot").textContent=brl(soma(qtd))}
function soma(q){return CARD.reduce(function(s,c){return s+(q[c.id]||0)*c.p},0)}
$("tipo").onchange=function(){var e=this.value=="Entrega";$("end").hidden=!e;$("endl").hidden=!e};
function enviar(){
  var itens=CARD.filter(function(c){return qtd[c.id]>0});
  if(!itens.length){$("msg1").textContent="Escolha pelo menos um item.";return}
  if(!$("nome").value.trim()){$("msg1").textContent="Informe seu nome.";return}
  var o={id:Date.now(),nome:$("nome").value.trim(),tel:$("tel").value.trim(),tipo:$("tipo").value,end:$("end").value.trim(),hora:$("hora").value,pag:$("pag").value,obs:$("obs").value.trim(),q:JSON.parse(JSON.stringify(qtd))};
  var t="*Novo pedido – Assados D’Casa* 🔥\nNome: "+o.nome+(o.tel?"\nTel: "+o.tel:"")+"\n\n"+itens.map(function(c){return qtd[c.id]+"x "+c.n}).join("\n")+"\n\nTotal: "+brl(soma(qtd))+"\n"+o.tipo+(o.tipo=="Entrega"&&o.end?" – "+o.end:"")+" às "+o.hora+"\nPagamento: "+o.pag+(o.obs?"\nObs: "+o.obs:"");
  window.open("https://wa.me/"+FONE+"?text="+encodeURIComponent(t),"_blank");
  qtd={};menu();$("tot").textContent=brl(0);$("obs").value="";
  $("msg1").textContent="Pedido enviado! Confirme no WhatsApp.";
}
menu();
</script>
</body>
</html>
